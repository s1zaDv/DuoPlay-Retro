<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Obrigado · DuoPlay Retro</title>
<meta name="description" content="Recebemos seu envio. Obrigado por fazer parte do DuoPlay Retro.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF7F3;--paper:#FFFFFF;--ink:#0A1A17;--violet:#2FD07A;--blue:#4DB0FF;--on:#0A1A17;padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:500 1.0625rem/1.55 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-wrap:anywhere}
.wrap{max-width:760px;margin:0 auto;padding:20px 20px 56px}.logo{font-weight:800;font-stretch:75%;font-size:1.35rem;padding:4px 12px;background:var(--violet);color:var(--on);border:3px solid var(--ink);transform:rotate(-2deg);text-decoration:none;display:inline-block}
.crumbs{color:#3F5F55;margin:18px 0;font-size:.95rem}.crumbs a{color:var(--ink);font-weight:700}
h1{font-weight:800;font-stretch:75%;font-size:clamp(2.4rem,9vw,5rem);line-height:.95;text-transform:uppercase;margin:10px 0 14px}
.brut{background:var(--paper);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:clamp(20px,4vw,36px)}p{margin:0 0 16px}
.btn{font:800 1rem "Bricolage Grotesque",system-ui,sans-serif;color:var(--on);background:var(--violet);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:10px 18px;min-height:44px;text-decoration:none;display:inline-flex;align-items:center;margin:0 10px 10px 0}
.btn.b{background:var(--blue)}a:focus-visible{outline:4px solid var(--violet);outline-offset:3px}
</style>
</head>
<body><div class="wrap">
<a class="logo" href="/">DuoPlay Retro</a>
<nav class="crumbs" aria-label="Você está em"><a href="/">Início</a> › <span>Obrigado</span></nav>
<main class="brut">
<h1>Obrigado!</h1>
<p id="txt">Recebemos sua mensagem. Nossa equipe responderá assim que possível.</p>
<p><a class="btn" href="/">Voltar ao início</a><a class="btn b" href="/conta.html">Minha conta</a></p>
</main></div>
<script>
(function () {
  var T = { beta: "Você está na Beta do DuoPlay. Lembre-se: na Beta o limite é de 1 hora de uso por dia, contado por 24 horas a partir da meia-noite (horário de Brasília). Entre na sua conta para acompanhar." };
  var k = new URLSearchParams(location.search).get("de");
  if (k && Object.prototype.hasOwnProperty.call(T, k)) document.getElementById("txt").textContent = T[k];
})();
</script></body></html>
