/* Textos dos documentos: edite aqui. {org} vira o nome da empresa definido em config.js. */
var LEGAL = {
  termos: { t: "Termos de Uso", s: [
    ["Apresentação do DuoPlay", "O DuoPlay Retro e o DuoPlay Controle (em conjunto, “DuoPlay”) são aplicativos para Android e Android TV oferecidos pelos {org}, identificados nestes documentos como {responsible}. O atendimento é feito pela página de Contato do site oficial. O DuoPlay permite jogar títulos clássicos de videogame usando o celular como controle.\nEstes Termos regulam o uso do site, dos aplicativos e das assinaturas. Leia-os junto com a Política de Privacidade, a Política de Cancelamento, a Política de Reembolso, as Regras da Comunidade e o documento de Propriedade Intelectual e Responsabilidade do Usuário."],
    ["Aceitação dos termos", "Ao baixar, instalar, assinar ou usar o DuoPlay, você declara que leu, entendeu e concorda com estes Termos. Se não concordar, não use o serviço.\nAs informações sobre planos, valores e condições são apresentadas antes da contratação. A versão em vigor é a publicada no site, com a data de atualização."],
    ["Requisitos de utilização", "Para contratar, você precisa ter capacidade civil. Menores de 18 anos só podem usar o DuoPlay com autorização e acompanhamento de um responsável, que responde pela contratação.\nO aparelho deve atender aos requisitos da seção Compatibilidade.\nBaixe os aplicativos somente pelos links oficiais do site. Arquivos obtidos em outros lugares podem ter sido alterados, e não nos responsabilizamos por eles.\nComo a instalação é feita fora de uma loja de aplicativos, o Android pede que você libere a instalação de fontes desconhecidas. Faça isso apenas para o arquivo baixado do site oficial."],
    ["Licença de uso", "Concedemos a você uma licença pessoal, limitada, não exclusiva e não transferível para usar o DuoPlay em seus aparelhos, durante o período contratado, sem fins comerciais, nos termos da Lei do Software (Lei 9.609/1998).\nO DuoPlay é licenciado, não vendido. Os direitos não concedidos expressamente ficam reservados. Você não pode vender, alugar, sublicenciar, redistribuir, compartilhar seu acesso com terceiros, extrair código nem criar obras derivadas, exceto quando a lei permitir expressamente."],
    ["Assinaturas e pagamentos", "Antes da contratação mostramos o plano, a duração, o valor total cobrado, a forma de cobrança e as condições de renovação e cancelamento. Formas de pagamento: Pix, cartão de crédito, cartão de débito e boleto, por meio do Mercado Pago. Os planos são pré-pagos, por período determinado, e não têm renovação automática.\nToda a transação de pagamento ocorre fora do app e do site, no ambiente do Mercado Pago. Não recebemos nem armazenamos o número completo do seu cartão.\nO valor de um ciclo já contratado não muda durante o ciclo. Reajustes valem apenas para ciclos futuros e serão informados com antecedência de 7 (sete) dias.\nCancelamento e reembolso seguem as respectivas Políticas."],
    ["Atualizações e disponibilidade", "Durante o plano, você tem direito às atualizações e versões disponibilizadas aos assinantes, conforme as condições do serviço. Não garantimos prazo, frequência ou conteúdo de versões futuras.\nAlgumas versões podem ser identificadas como experimentais ou de teste. Elas podem apresentar falhas e são oferecidas com essa ressalva, sem prejuízo dos direitos do consumidor.\nPodem ocorrer manutenções e instabilidades, informadas na seção Status do Serviço quando possível. O funcionamento também depende de fatores fora do nosso controle, como o aparelho, o Android e a sua rede."],
    ["Condutas proibidas", "É proibido:\n- usar o DuoPlay para violar leis ou direitos de terceiros, incluindo direitos autorais;\n- distribuir, vender ou hospedar jogos, ROMs, ISOs, BIOS ou outros arquivos protegidos;\n- compartilhar, revender ou publicar o acesso do seu plano;\n- burlar limitações técnicas, controles de acesso ou a cobrança;\n- tentar acessar sistemas ou dados que não são seus;\n- divulgar versões alteradas do DuoPlay ou arquivos com código malicioso;\n- assediar ou prejudicar outros usuários.\nAs Regras da Comunidade também se aplicam."],
    ["Suspensão e encerramento de acesso", "Podemos suspender ou encerrar o acesso, total ou parcialmente, em caso de violação destes Termos, fraude, uso ilícito ou ordem de autoridade. Sempre que possível, informamos o motivo e damos a você a chance de se manifestar, exceto em situações urgentes ou de segurança.\nSe o encerramento ocorrer sem culpa sua, você tem direito à devolução proporcional do período pago e não utilizado, conforme a Política de Reembolso."],
    ["Limitação de responsabilidade", "Respondemos pelos danos que a lei nos atribuir, inclusive os previstos no Código de Defesa do Consumidor. Nada nestes Termos exclui ou reduz direitos do consumidor garantidos em lei.\nDentro do que a lei permite, não respondemos por:\n- arquivos, jogos e conteúdos que você escolher usar com o DuoPlay;\n- uso do serviço em desacordo com estes Termos;\n- falhas causadas por aparelhos fora dos requisitos, alterações no sistema do aparelho, aplicativos de terceiros, rede ou energia;\n- perda de dados salvos decorrente de ação ou omissão sua, como não manter cópia de segurança.\nRecomendamos manter cópia de segurança dos seus arquivos e progressos."],
    ["Alterações dos termos", "Podemos atualizar estes Termos para refletir mudanças no serviço ou na lei. Mudanças relevantes serão informadas no site, com data de vigência e antecedência de 7 (sete) dias.\nAs alterações não afetam o período e o preço já contratados. Se não concordar com a nova versão, você pode cancelar conforme a Política de Cancelamento."],
    ["Legislação aplicável", "Estes Termos seguem as leis do Brasil. Para consumidores, é competente o foro do domicílio do consumidor (art. 101, I, do Código de Defesa do Consumidor). Para as demais pessoas, o foro da {foro}.\nAntes de qualquer medida judicial, convidamos você a nos procurar pelo contato abaixo para tentarmos resolver de forma amigável. Isso não limita seu acesso à Justiça nem aos órgãos de defesa do consumidor."],
    ["Contato", "Página de Contato no site oficial do DuoPlay (duoplayretro.netlify.app). Nossa equipe responderá assim que possível."]
  ]},
  privacidade: { t: "Política de Privacidade", s: [
    ["Introdução", "Esta Política explica como os {org} tratam dados pessoais no site e nos aplicativos do DuoPlay, conforme a Lei Geral de Proteção de Dados (LGPD, Lei 13.709/2018). Tratamos apenas os dados necessários, com base em uma hipótese legal.\nEncarregado pelo tratamento de dados: {responsible}, responsável pelo projeto DuoPlay, contatável pela página de Contato (assunto Privacidade)."],
    ["Dados coletados", "Coletamos só o que é necessário para cada finalidade:\n- Dados enviados nos formulários: nome ou apelido (opcional), e-mail ou contato, mensagem e, nos relatos de bug, versão do DuoPlay, modelo do dispositivo, versão do Android e etapas para reproduzir o erro.\n- Quando as assinaturas abrirem: e-mail, plano, vigência e situação da assinatura. Dados de pagamento são tratados pelo Mercado Pago. Recebemos apenas: identificador da transação, status do pagamento, plano escolhido, data de aprovação e e-mail do pagador (não recebemos nem armazenamos o número completo do cartão).\n- Dados técnicos e de segurança: registros técnicos básicos gerados pela hospedagem do site (endereço IP, data e hora de acesso e navegador) e relatórios de erro enviados voluntariamente pelo usuário para diagnóstico.\n- Dados dos aplicativos: nenhum dado pessoal é coletado automaticamente pelo aplicativo. Configurações, saves e arquivos do usuário ficam armazenados localmente no próprio dispositivo, salvo quando o usuário opta por enviar um relato de erro.\nNão pedimos dados pessoais sensíveis. Pedimos que você também não os inclua em mensagens."],
    ["Finalidades do tratamento", "- Responder solicitações e prestar suporte (execução de contrato ou procedimentos preliminares; legítimo interesse).\n- Processar assinaturas e cobranças (execução de contrato).\n- Cumprir obrigações legais e fiscais (obrigação legal).\n- Corrigir falhas e melhorar a estabilidade (legítimo interesse).\n- Prevenir fraudes e abusos (legítimo interesse).\n- Exercer direitos em processos judiciais, administrativos ou arbitrais (exercício regular de direitos).\nNão usamos seus dados para finalidades incompatíveis com essas."],
    ["Compartilhamento de dados", "Não vendemos dados pessoais. Compartilhamos apenas o necessário com provedores que nos ajudam a operar: hospedagem do site, recebimento de formulários, processamento de pagamento e envio de e-mails: Netlify (hospedagem e formulários, Estados Unidos), MediaFire (hospedagem dos arquivos de download, Estados Unidos), Mercado Pago (processamento de pagamentos, Brasil) e o provedor de e-mail usado no suporte. Também podemos compartilhar por obrigação legal, ordem de autoridade ou para exercer direitos em processos.\nSe algum provedor estiver fora do Brasil, a transferência internacional ocorre por meio de cláusulas contratuais padrão e mecanismos de segurança adotados pelos provedores envolvidos, nos termos da LGPD."],
    ["Armazenamento", "Os dados enviados pelo site e pelo suporte ficam nos servidores do provedor de hospedagem (Netlify) e na caixa de e-mail oficial do suporte. Os dados de execução do aplicativo ficam salvos localmente no dispositivo do usuário.\nDenúncias não são publicadas. Apenas o administrador responsável pelo suporte e pela manutenção do DuoPlay tem credenciais de acesso às mensagens e denúncias recebidas."],
    ["Segurança", "Adotamos medidas técnicas e administrativas razoáveis para proteger os dados contra acesso não autorizado, perda e alteração, e limitamos o acesso a quem precisa. Medidas adotadas: criptografia em trânsito (HTTPS/TLS) no site; senha forte e verificação em duas etapas nas contas administrativas; e processamento local de jogos e saves no aparelho, sem envio automático para servidores externos.\nNenhum sistema é totalmente imune a incidentes. Em caso de incidente que possa causar risco ou dano relevante, comunicaremos você e a Autoridade Nacional de Proteção de Dados (ANPD), nos termos da LGPD.\nProteja também o seu lado: não compartilhe seu acesso e use apenas os links oficiais."],
    ["Direitos dos titulares", "Você pode, mediante pedido: confirmar se tratamos seus dados; acessá-los; corrigi-los; pedir anonimização, bloqueio ou eliminação de dados desnecessários ou tratados em desconformidade; pedir portabilidade; saber com quem compartilhamos; ser informado sobre a possibilidade de não consentir e suas consequências; revogar o consentimento; e pedir revisão de decisões automatizadas, se houver (arts. 18 e 20 da LGPD).\nPara exercer seus direitos, use a página de Contato no site oficial do DuoPlay, selecionando o assunto Privacidade. Respondemos em até 15 (quinze) dias corridos e podemos pedir informações para confirmar sua identidade. Você também pode reclamar à ANPD."],
    ["Cookies", "O site utiliza apenas cookies e armazenamento local estritamente necessários para o funcionamento técnico, a segurança e a navegação, sem rastreamento publicitário nem perfis comportamentais. O site carrega fontes (Google Fonts) e bibliotecas (cdnjs) de servidores externos, que podem receber o seu endereço IP.\nSe passarmos a usar cookies ou medição de uso além dos estritamente necessários, pediremos seu consentimento e atualizaremos esta Política antes."],
    ["Dados de menores", "O serviço não é direcionado a crianças (menores de 12 anos). Dados de crianças só são tratados com consentimento específico e em destaque de um responsável, e os de adolescentes são tratados no seu melhor interesse (art. 14 da LGPD).\nSe você acredita que um menor nos enviou dados sem autorização, use a página de Contato, assunto Privacidade, e eliminaremos os dados."],
    ["Retenção e eliminação", "Guardamos os dados pelo tempo necessário às finalidades desta Política, ao cumprimento de obrigações legais, como registros de acesso por 6 meses (Marco Civil da Internet) e dados fiscais e de pagamento pelo prazo exigido pela legislação tributária e civil, e ao exercício regular de direitos. Prazos por tipo de dado: mensagens de suporte e relatos de bug, até 12 meses após o encerramento do atendimento; dados de assinatura e pagamento, enquanto durar a assinatura e pelo prazo legal aplicável após o cancelamento; registros técnicos de acesso, até 6 meses. Depois, eliminamos ou anonimizamos."],
    ["Contato sobre privacidade", "Privacidade: página de Contato no site oficial, assunto Privacidade. Encarregado: {responsible}, responsável pelo projeto DuoPlay.\nAlterações desta Política serão publicadas aqui, com a data de atualização."]
  ]},
  cancelamento: { t: "Política de Cancelamento", s: [
    ["Como cancelar", "Você pode pedir o cancelamento a qualquer momento, pelo formulário da página de Contato no site oficial, selecionando o assunto Cancelamento, ou pelo canal de atendimento informado no comprovante da compra. Atualmente o cancelamento não é feito por painel automático no aplicativo: ele é registrado manualmente, mediante solicitação nesses canais.\nNão exigimos justificativa nem etapas desnecessárias para cancelar."],
    ["Cancelamento da renovação", "Os planos atuais são avulsos (pré-pagos por período determinado), sem renovação automática. Caso venham a ser oferecidos planos com cobrança recorrente, isso será informado claramente antes da contratação.\nNesses planos futuros, cancelar a renovação impedirá as cobranças seguintes, o plano já pago continuará ativo até o fim do período e o pedido deverá ser feito com antecedência mínima de 48 (quarenta e oito) horas antes da data de renovação.\nCancelar a renovação não é pedir reembolso. Os pedidos são diferentes."],
    ["Acesso após cancelamento", "Nos planos pré-pagos, o acesso e as atualizações continuam até o fim do período já pago. Depois disso, a versão já instalada no dispositivo continua funcionando normalmente em modo offline, com os arquivos locais do usuário, mas deixa de receber novas atualizações, downloads de versões futuras e recursos exclusivos vinculados à assinatura.\nSeus dados seguem a Política de Privacidade."],
    ["Cancelamento pelo DuoPlay", "Podemos encerrar um plano ou o serviço com aviso prévio de 15 (quinze) dias corridos, feito por aviso no site oficial e por mensagem ao endereço informado na compra. Nesse caso, devolvemos o valor proporcional ao período pago e não usufruído, conforme a Política de Reembolso."],
    ["Hipóteses de suspensão", "Podemos suspender o acesso em caso de fraude ou contestação de pagamento de má-fé, violação dos Termos de Uso (em especial distribuição de arquivos protegidos ou compartilhamento do acesso), ordem de autoridade ou risco à segurança do serviço ou de outros usuários. Sempre que possível, informamos o motivo."],
    ["Procedimento", "1. Envie o pedido informando o e-mail usado na compra e o plano.\n2. Confirmamos o recebimento por escrito.\n3. Informamos a data em que o cancelamento passa a valer e a situação do seu acesso.\nGuarde a confirmação como comprovante."],
    ["Prazo de processamento", "O cancelamento é registrado em até 3 (três) dias úteis e vale, para cobranças futuras, a partir da data do pedido. Se houver cobrança depois de um pedido regular, ela será devolvida conforme a Política de Reembolso."],
    ["Contato", "Página de Contato no site oficial do DuoPlay (duoplayretro.netlify.app), assunto Cancelamento."]
  ]},
  reembolso: { t: "Política de Reembolso", s: [
    ["Direito de arrependimento", "Se você contratou pela internet, pode desistir em até 7 dias corridos, contados da contratação ou do recebimento do serviço, sem precisar justificar. Devolvemos todos os valores pagos, atualizados quando aplicável, nos termos do art. 49 do Código de Defesa do Consumidor e do Decreto 7.962/2013.\nO pedido pode ser feito pelo mesmo meio usado na contratação ou pelo contato abaixo."],
    ["Solicitação de reembolso", "Use o assunto Assinaturas e pagamentos na página de Contato, informando o e-mail usado na compra, o plano e a data da contratação.\nCancelar a renovação não é o mesmo que pedir reembolso. Você pode fazer os dois pedidos."],
    ["Situações elegíveis", "- Desistência dentro de 7 dias da contratação.\n- Cobrança indevida ou sem contratação.\n- Cobrança em duplicidade.\n- Cobrança depois de cancelamento regular.\n- Serviço não prestado, ou prestado de forma diferente da oferecida, e não corrigido em prazo razoável.\n- Encerramento do serviço por nossa iniciativa, sem culpa sua (valor proporcional)."],
    ["Cobranças indevidas", "Cobranças sem contratação ou após cancelamento regular são devolvidas na forma do art. 42, parágrafo único, do Código de Defesa do Consumidor, quando aplicável. Se você não reconhecer uma cobrança, avise-nos o quanto antes para investigarmos e resolvermos sem que seja preciso contestá-la no banco."],
    ["Cobranças duplicadas", "Cobranças duplicadas são estornadas integralmente após a confirmação."],
    ["Problemas na prestação do serviço", "Se o serviço contratado não funcionar como informado, você pode pedir correção, abatimento proporcional do preço ou devolução, nos termos do art. 20 do Código de Defesa do Consumidor. Podemos pedir informações técnicas, como versão do DuoPlay e modelo do aparelho, para tentar resolver.\nSituações já informadas na seção Compatibilidade serão analisadas caso a caso, sem excluir direitos do consumidor."],
    ["Processamento", "O reembolso é feito, sempre que possível, pelo mesmo meio de pagamento da compra. No cartão, o estorno aparece conforme o calendário da operadora. A devolução é processada diretamente pelo Mercado Pago, a plataforma de pagamento usada na compra: estorno na conta de origem, no caso do Pix, ou devolução ao saldo da conta no Mercado Pago."],
    ["Prazos", "Respondemos ao pedido em até 3 (três) dias úteis e iniciamos a devolução em até 5 (cinco) dias úteis após a aprovação."],
    ["Contato", "Página de Contato no site oficial do DuoPlay (duoplayretro.netlify.app), assunto Assinaturas e pagamentos."]
  ]},
  comunidade: { t: "Regras da Comunidade", s: [
    ["Respeito entre os membros", "A comunidade existe para ajudar quem usa o DuoPlay. Trate todos com respeito e boa-fé. Divergir é normal; ofender não."],
    ["Proibição de assédio", "É proibido perseguir, ameaçar, intimidar, humilhar, expor dados pessoais de terceiros ou insistir em contato indesejado."],
    ["Proibição de discriminação", "É proibido discriminar ou incitar ódio por raça, cor, etnia, origem, religião, gênero, orientação sexual, deficiência, idade ou qualquer outra característica."],
    ["Conteúdo permitido", "Dúvidas, relatos de problemas, sugestões, resultados de testes no seu aparelho e conversa sobre o DuoPlay e jogos, de forma respeitosa e dentro da lei. Não publique dados pessoais seus ou de outras pessoas, nem informações de pagamento."],
    ["Propriedade intelectual", "Não compartilhe, peça, ofereça nem indique onde obter jogos, ROMs, ISOs, BIOS, chaves ou outros arquivos protegidos sem autorização. Não divulgue versões alteradas, quebradas ou não oficiais do DuoPlay. Esse tipo de conteúdo será removido."],
    ["Proibição de spam", "Sem propaganda não autorizada, mensagens repetidas, correntes ou divulgação em massa."],
    ["Proibição de golpes e links maliciosos", "Não publique links suspeitos, tentativas de fraude nem pedidos de dados pessoais, senhas ou pagamentos fora dos canais oficiais. A equipe nunca pede sua senha."],
    ["Denúncias", "Use o canal Denúncias da Central da Comunidade. As denúncias são privadas: não são publicadas e a identidade de quem denuncia não é divulgada ao denunciado, salvo obrigação legal. Denúncias falsas ou de má-fé também violam estas regras."],
    ["Moderação", "A moderação pode remover conteúdo, advertir, restringir acesso ou suspender membros, conforme a gravidade, a reincidência e o contexto, de forma proporcional. A moderação não monitora todo o conteúdo e não responde por mensagens de terceiros, mas age quando toma conhecimento de uma violação."],
    ["Advertências e suspensões", "Em geral: advertência, restrição temporária e, na reincidência, suspensão. Casos graves, como ameaça, fraude, distribuição de arquivos protegidos ou conteúdo ilegal, podem levar à remoção e suspensão imediatas, e podem ser comunicados às autoridades.\nPara contestar uma medida, envie sua solicitação pela página de Contato no site oficial do DuoPlay (duoplayretro.netlify.app), selecionando o assunto Moderação ou Apelação, em até 7 (sete) dias corridos."],
    ["Regras complementares do Discord", "O servidor do Discord ainda está em preparação. Quando abrir, as regras complementares serão publicadas aqui, junto às diretrizes do próprio Discord."]
  ]},
  propriedade: { t: "Propriedade Intelectual e Responsabilidade do Usuário", s: [
